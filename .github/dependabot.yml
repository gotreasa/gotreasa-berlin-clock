version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    # The groups below raise about 10 PRs in a heavy week; the default limit
    # of 5 would hold some of them back.
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 3
      semver-major-days: 30
    # A dependency joins the FIRST group it matches, so order matters.
    # Patterns are globs on the package name: '@babel/*' matches scoped Babel
    # packages only, so the unscoped babel-jest lands in jest-major.
    groups:
      # Security fixes: one PR, raised as soon as an advisory lands
      # (cooldown and schedule do not apply to security updates).
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      # Majors that only work when their family moves together.
      # ESLint 10 needs @babel/eslint-parser 8, which needs @babel/core 8, so
      # the lint and Babel majors can only land together, after a manual
      # migration (see the Dependabot RCA of 2026-10-05). Kept to the coupled
      # core on purpose: plugin majors (sonarjs, jest, globals, ...) are
      # independent and must not be trapped here while that work is open.
      lint-babel-major:
        update-types: ['major']
        patterns: ['eslint', '@eslint/*', '@babel/*', '@types/babel__*']
      # Before jest-major so jest-pact lands here, not in jest-*.
      pact-major:
        update-types: ['major']
        patterns: ['@pact-foundation/*', '@pactflow/*', 'jest-pact']
      jest-major:
        update-types: ['major']
        patterns: ['jest', 'jest-*', 'babel-jest', '@types/jest']
      stryker-major:
        update-types: ['major']
        patterns: ['@stryker-mutator/*']
      release-major:
        update-types: ['major']
        patterns: ['release-it', '@release-it/*', 'auto-changelog']
      commitlint-major:
        update-types: ['major']
        patterns: ['@commitlint/*']
      # Everything else that is minor or patch: low risk, and auto-mergeable
      # by the pipeline's dependabot_auto_merge job. Runtime and tooling are
      # split so a tooling break never holds back a runtime fix.
      npm-production:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
        patterns: ['*']
      npm-development:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
        patterns: ['*']
      # Any other major (sonar, absolute-version, npm-check-updates,
      # simple-git, ...) matches no group and arrives as its own PR.

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
    cooldown:
      default-days: 3
      semver-major-days: 30
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
      # Minor and patch bumps together; each action's major arrives as its
      # own PR, since a new major can change inputs or defaults.
      github-actions:
        update-types: ['minor', 'patch']
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'build'
    cooldown:
      default-days: 3
      semver-major-days: 30
    ignore:
      # Only upgrade Node on our terms (when the new even major reaches
      # Active LTS); keep patch/minor updates on the current LTS line.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: 'bundler'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 3
      semver-major-days: 30
    groups:
      bundler-security:
        applies-to: security-updates
        patterns: ['*']
      bundler:
        update-types: ['minor', 'patch']
        patterns: ['*']
