schemaVersion: '2.0.0'

metadataTest:
  exposedPorts: ['9080']
  entrypoint: ['node']
  cmd: ['app.js']
  workdir: '/usr/src/app'
  user: '1000'
  envVars:
    - key: 'SERVER_PORT'
      value: '9080'

commandTests:
  - name: '🔎  node is installed'
    command: 'which'
    args: ['node']
    exitCode: 0
    expectedOutput: ['/usr/local/bin/node']
  - name: '🔎  node is version 24'
    command: 'node'
    args: ['--version']
    exitCode: 0
    expectedOutput: ['v24.']
  - name: '🚫 npm is not shipped in the runtime image'
    command: 'sh'
    args: ['-c', 'command -v npm npx || echo absent']
    exitCode: 0
    expectedOutput: ['absent']
    excludedOutput: ['/']

fileContentTests:
  - name: '📦 Package JSON'
    path: '/usr/src/app/package.json'
    expectedContents:
      [
        '.*"start:app": "export SERVER_PORT=9080 && node app\.js".*',
        '.*"name": "gotreasa-berlin-clock",.*',
      ]

fileExistenceTests:
  - name: '📦 Package JSON'
    path: '/usr/src/app/package.json'
    shouldExist: true
  - name: '📄 Swagger Document'
    path: '/usr/src/app/openapi.json'
    shouldExist: true
  - name: '🚂 Express Server'
    path: '/usr/src/app/node_modules/express'
    shouldExist: true
  - name: '💿 App entrypoint'
    path: '/usr/src/app/app.js'
    shouldExist: true
  - name: '📝 Goss file'
    path: '/usr/src/app/goss.yaml'
    shouldExist: true
  - name: '🗂️ App directory'
    path: '/usr/src/app'
    shouldExist: true
    permissions: 'drwxrwxr-x'
    uid: 1000
    gid: 0
    isExecutableBy: 'group'
